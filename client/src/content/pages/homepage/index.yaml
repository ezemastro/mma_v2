header:
  title: Marcelo Mastropietro
  subtitle: Ingeniería
  headline: No existe proyecto de arquitectura sin estructura.
  subtext: >-
    Diseño y cálculo estructural en hormigón y acero para arquitectos y
    empresas, desde hace más de 30 años.
  heroObra: estadio-ferrocarril-oeste-tribunas-caballito
